<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="inicio-de-sesi-n">
    <div class="body">
      <div
        class="layout"
        style="
          background: url(layout0.png) center;
          background-size: cover;
          background-repeat: no-repeat;
        "
      >
        <div class="container"></div>
        <div class="container2">
          <div class="container3">
            <div class="container4">
              <div class="heading-1">

              </div>

                </div>
              </div>
              <div class="link">
                <img
                  class="fluent-beach-28-regular"
                  src="fluent-beach-28-regular0.svg"
                />
                <div class="layout2">
                  <div class="ruta-viajera">RutaViajera</div>
                </div>
              </div>
            </div>
            <div class="form">
              <div class="container5">
                <div class="label">
                  <div class="correo-electr-nico">Correo Electrónico</div>
                </div>
                <div class="container6">
                  <div class="email-input">
                    <div class="tu-email-com">tu@email.com</div>
                  </div>
                  <img class="icon" src="icon0.svg" />
                </div>
              </div>
              <div class="container5">
                <div class="label">
                  <div class="contrase-a">Contraseña</div>
                </div>
                <div class="container6">
                  <div class="password-input">
                    <div class="div">••••••••</div>
                  </div>
                  <img class="icon2" src="icon1.svg" />
                </div>
              </div>
              <div class="container7">
                <div class="label2">
                  <div class="checkbox"></div>
                  <div class="text">
                    <div class="recordarme">Recordarme</div>
                  </div>
                </div>
                <div class="link2">
                  <div class="olvidaste-tu-contrase-a">
                    ¿Olvidaste tu contraseña?
                  </div>
                </div>
              </div>
              <div class="button">
                <div class="iniciar-sesi-n">Iniciar Sesión</div>
              </div>
            </div>
            <div class="container8">
              <div class="no-tienes-cuenta-reg-strate-aqu">
                <span>
                  <span class="no-tienes-cuenta-reg-strate-aqu-span">
                    ¿No tienes cuenta?
                  </span>
                  <span class="no-tienes-cuenta-reg-strate-aqu-span2">
                    Regístrate aquí
                  </span>
                </span>
              </div>
            </div>
            <div class="container9">
              <div class="container10">
                <div class="container11">
                  <div class="container12"></div>
                </div>
                <div class="container13">
                  <div class="text2">
                    <div class="o-contin-a-con">O continúa con</div>
                  </div>
                </div>
              </div>
              <div class="container14">
                <div class="button2">
                  <img class="icon3" src="icon2.svg" />
                  <div class="text3">
                    <div class="google">Google</div>
                  </div>
                </div>
                <div class="button3">
                  <img class="icon4" src="icon3.svg" />
                  <div class="text4">
                    <div class="facebook">Facebook</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="container15">
            <div class="link3">
              <div class="volver-al-inicio">← Volver al inicio</div>
            </div>
          </div>

      </div>

</html>
